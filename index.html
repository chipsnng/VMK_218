<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>218 ВМК МГУ</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f3f4f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="218 ВМК">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .snap-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .snap-slider::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 767px) {
      .snap-item {
        scroll-snap-align: start;
        flex: 0 0 100%;
        width: 100%;
      }
    }
  </style>
</head>
<body class="bg-[#f3f5f9] dark:bg-[#0f111a] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-24 transition-colors duration-300">

  <!-- Верхняя шапка -->
  <header class="p-4 max-w-6xl w-full mx-auto flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-brand-500/20">
        218
      </div>
      <div>
        <h1 class="font-extrabold text-lg leading-tight tracking-tight text-slate-900 dark:text-white">ВМК МГУ</h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span id="week-parity-badge" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-brand-100 dark:bg-brand-950 text-brand-600 dark:text-brand-300">
            --
          </span>
          <span class="text-xs text-slate-400" id="current-month-year">...</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-200 shadow-sm flex items-center justify-center active:scale-95 transition-all">
        <span id="theme-icon">🌙</span>
      </button>
      <button onclick="goToToday()" class="text-xs bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2.5 rounded-full shadow-md shadow-brand-500/20 active:scale-95 transition-all">
        Сегодня
      </button>
    </div>
  </header>

  <!-- Календарная плашка в форме капсулы (как на референсе) -->
  <div class="max-w-4xl w-full mx-auto px-4 my-2">
    <div class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border border-slate-200/60 dark:border-slate-700/50 rounded-full p-2 shadow-sm">
      <div class="flex items-center justify-between px-3 mb-1 text-[11px] text-slate-400 font-medium">
        <button onclick="changeWeek(-1)" class="hover:text-brand-600 transition-colors">← Пред. неделя</button>
        <span id="week-range-label" class="text-slate-700 dark:text-slate-200 font-bold"></span>
        <button onclick="changeWeek(1)" class="hover:text-brand-600 transition-colors">След. неделя →</button>
      </div>
      
      <div class="grid grid-cols-7 gap-1" id="week-days-container">
        <!-- Дни недели в форме круглых кнопок -->
      </div>
    </div>
  </div>

  <!-- Главное содержимое расписания -->
  <main class="max-w-4xl w-full mx-auto flex-1 px-4 mt-4">
    <div id="slider-container" class="snap-slider md:grid md:grid-cols-1 md:gap-6 md:overflow-visible">
      <!-- Дни с парами -->
    </div>
  </main>

  <!-- Навигационная панель снизу (как на скрине) -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-30">
    <div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-2xl border border-slate-200/80 dark:border-slate-700/80 rounded-full p-1.5 shadow-xl flex items-center gap-1">
      <button class="flex items-center gap-2 bg-brand-50 dark:bg-brand-950/80 text-brand-600 dark:text-brand-300 px-5 py-2.5 rounded-full font-semibold text-xs transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span>Расписание</span>
      </button>
      <button onclick="alert('Функция ДЗ в разработке')" class="flex items-center gap-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 px-4 py-2.5 rounded-full text-xs font-medium transition-all">
        <span>📝</span>
        <span>ДЗ</span>
      </button>
    </div>
  </div>

  <script>
    let scheduleData = null;
    let currentMonday = getMonday(new Date());
    let selectedDate = new Date();
    let isProgrammaticScroll = false;

    const dayNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
    const monthNames = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function isSameDate(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function getWeekParity(date) {
      const academicStart = new Date(2026, 8, 1);
      const startMonday = getMonday(academicStart);
      const targetMonday = getMonday(date);
      
      const diffTime = targetMonday - startMonday;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const weekNum = Math.floor(diffDays / 7) + 1;
      
      const isOdd = Math.abs(weekNum) % 2 !== 0;
      return {
        weekNum: weekNum,
        isOdd: isOdd,
        key: isOdd ? 'odd' : 'even',
        label: isOdd ? 'нечётная' : 'чётная'
      };
    }

    async function init() {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
      
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '🌙';
      }

      try {
        const response = await fetch('schedule.json');
        scheduleData = await response.json();
        renderWeekPages();
        setupScrollListener();
      } catch (err) {
        document.getElementById('slider-container').innerHTML = 
          '<div class="w-full text-center p-8 text-red-500 font-medium">Ошибка загрузки расписания</div>';
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
        document.getElementById('theme-icon').innerText = '🌙';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
        document.getElementById('theme-icon').innerText = '☀️';
      }
    }

    function renderWeekPages() {
      const slider = document.getElementById('slider-container');
      slider.innerHTML = '';

      renderCalendarHeader();

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);

        const page = document.createElement('div');
        page.className = 'snap-item w-full space-y-3';
        page.innerHTML = getDayScheduleHTML(date);

        slider.appendChild(page);
      }

      if (window.innerWidth < 768) {
        scrollToSelectedDate(false);
      }
    }

    function renderCalendarHeader() {
      const container = document.getElementById('week-days-container');
      container.innerHTML = '';

      const sunday = new Date(currentMonday);
      sunday.setDate(sunday.getDate() + 6);

      const parity = getWeekParity(selectedDate);
      document.getElementById('week-parity-badge').innerText = `${parity.label} неделя`;

      document.getElementById('week-range-label').innerText = 
        `${currentMonday.getDate()} ${monthNames[currentMonday.getMonth()].slice(0, 3)} — ${sunday.getDate()} ${monthNames[sunday.getMonth()].slice(0, 3)}`;

      document.getElementById('current-month-year').innerText = 
        `${selectedDate.getFullYear()} г.`;

      const shortDays = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);

        const isSelected = isSameDate(date, selectedDate);
        const isToday = isSameDate(date, new Date());

        const dayBtn = document.createElement('button');
        
        // Округлые кнопки (кружки/капсулы для дней)
        dayBtn.className = `flex flex-col items-center justify-center py-2 rounded-full transition-all duration-200 active:scale-90 ${
          isSelected 
            ? 'bg-brand-600 text-white font-bold shadow-md shadow-brand-500/30' 
            : isToday 
              ? 'bg-brand-100 dark:bg-slate-700 text-brand-700 dark:text-brand-300 font-bold border border-brand-300 dark:border-slate-600' 
              : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'
        }`;

        dayBtn.innerHTML = `
          <span class="text-[10px] uppercase font-semibold opacity-60">${shortDays[date.getDay()]}</span>
          <span class="text-xs sm:text-sm font-bold mt-0.5">${date.getDate()}</span>
        `;

        dayBtn.onclick = () => {
          selectedDate = new Date(date);
          renderCalendarHeader();
          if (window.innerWidth < 768) {
            scrollToSelectedDate(true);
          }
        };

        container.appendChild(dayBtn);
      }
    }

    function renderSingleLessonCard(lesson, isActive = true) {
      const isLecture = lesson.type === 'Лекция';
      
      const badgeColor = isActive 
        ? (isLecture 
            ? 'bg-purple-100 dark:bg-purple-950/80 text-purple-600 dark:text-purple-300' 
            : 'bg-brand-100 dark:bg-brand-950/80 text-brand-600 dark:text-brand-300')
        : 'bg-slate-100 dark:bg-slate-800 text-slate-400';

      const parityTag = lesson.parity 
        ? (lesson.parity === 'odd' ? 'Нечётная' : 'Чётная') 
        : null;

      return `
        <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between ${isActive ? '' : 'opacity-40'}">
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full ${badgeColor}">
                ${lesson.type}
              </span>
              ${parityTag ? `
                <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                  ${parityTag}
                </span>
              ` : ''}
            </div>

            <h3 class="font-bold text-slate-900 dark:text-white text-base sm:text-lg leading-snug mb-2">
              ${lesson.subject}
            </h3>
          </div>

          <div class="flex flex-wrap items-center gap-y-1 gap-x-4 text-xs text-slate-400 dark:text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-800">
            <span class="flex items-center gap-1 font-medium text-slate-500 dark:text-slate-300">
              👤 ${lesson.teacher}
            </span>
            <span class="flex items-center gap-1 font-semibold text-slate-600 dark:text-slate-200">
              🏛️ ауд. ${lesson.room}
            </span>
          </div>
        </div>
      `;
    }

    function getDayScheduleHTML(date) {
      const dayIndex = date.getDay(); 
      const dayName = dayNames[dayIndex];
      const isToday = isSameDate(date, new Date());

      if (dayIndex === 0) {
        return `
          <div class="bg-white/60 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-700/50 rounded-3xl p-12 text-center">
            <div class="w-16 h-16 bg-brand-50 dark:bg-slate-700 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">☕</div>
            <h2 class="font-bold text-slate-800 dark:text-white text-xl">Воскресенье</h2>
            <p class="text-xs text-slate-400 mt-1">Занятий нет, время отдыхать</p>
          </div>`;
      }

      const dayData = scheduleData.days.find(d => d.day === dayName);
      const parity = getWeekParity(date);

      if (!dayData || !dayData.lessons || dayData.lessons.length === 0) {
        return `
          <div class="bg-white/60 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-700/50 rounded-3xl p-12 text-center">
            <p class="font-bold text-slate-500">Занятий нет</p>
          </div>`;
      }

      let lessonsCount = dayData.lessons.length;

      let lessonsHTML = dayData.lessons.map((item, index) => {
        const times = item.time.split(' - ');
        const startTime = times[0] || item.time;
        const endTime = times[1] || '';

        let cardContentHTML = '';

        if (item.parity_split) {
          const oddLesson = item.parity_split.find(p => p.parity === 'odd') || item.parity_split[0];
          const evenLesson = item.parity_split.find(p => p.parity === 'even') || item.parity_split[1];

          cardContentHTML = `
            <div class="flex-1 flex flex-col bg-white dark:bg-slate-800/90 rounded-3xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden divide-y divide-slate-100 dark:divide-slate-700/60">
              ${renderSingleLessonCard(oddLesson, parity.key === 'odd')}
              ${renderSingleLessonCard(evenLesson, parity.key === 'even')}
            </div>
          `;
        } else {
          cardContentHTML = `
            <div class="flex-1 bg-white dark:bg-slate-800/90 rounded-3xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden">
              ${renderSingleLessonCard(item, true)}
            </div>
          `;
        }

        return `
          <div class="flex gap-3 sm:gap-4 items-stretch">
            <!-- Левая круглый блок-плашка с временем пары (как на макете) -->
            <div class="w-24 sm:w-28 flex-shrink-0 bg-white/70 dark:bg-slate-800/50 border border-slate-200/60 dark:border-slate-700/50 rounded-3xl p-3 flex flex-col justify-center items-center text-center">
              <span class="text-xs sm:text-sm font-black text-slate-800 dark:text-slate-100">${startTime}</span>
              <span class="text-[11px] font-semibold text-slate-400 mt-0.5">${endTime}</span>
              <span class="text-[9px] font-medium text-slate-400 dark:text-slate-500 mt-2 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full">
                ${index + 1} пара
              </span>
            </div>

            <!-- Правая часть с информацией о предмете -->
            ${cardContentHTML}
          </div>
        `;
      }).join('');

      return `
        <div class="flex items-center justify-between mb-3 px-2">
          <div class="flex items-center gap-2">
            <h2 class="font-extrabold text-slate-900 dark:text-white text-2xl tracking-tight">${dayName}</h2>
            <span class="text-sm font-medium text-slate-400">· ${date.getDate()} ${monthNames[date.getMonth()]}</span>
          </div>
          <div class="flex items-center gap-2">
            ${isToday ? '<span class="text-[10px] font-black uppercase px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-950/80 dark:text-emerald-400">Сегодня</span>' : ''}
            <span class="text-xs text-slate-400 font-medium">${lessonsCount} пар(ы)</span>
          </div>
        </div>
        <div class="space-y-3">
          ${lessonsHTML}
        </div>
      `;
    }

    function scrollToSelectedDate(smooth = true) {
      const slider = document.getElementById('slider-container');
      const dayIndex = (selectedDate.getDay() + 6) % 7; 
      const targetX = slider.clientWidth * dayIndex;

      isProgrammaticScroll = true;
      slider.scrollTo({
        left: targetX,
        behavior: smooth ? 'smooth' : 'auto'
      });

      setTimeout(() => { isProgrammaticScroll = false; }, 350);
    }

    function setupScrollListener() {
      const slider = document.getElementById('slider-container');
      let timeout = null;

      slider.addEventListener('scroll', () => {
        if (isProgrammaticScroll || window.innerWidth >= 768) return;

        clearTimeout(timeout);
        timeout = setTimeout(() => {
          const index = Math.round(slider.scrollLeft / slider.clientWidth);
          const newDate = new Date(currentMonday);
          newDate.setDate(newDate.getDate() + index);

          if (!isSameDate(newDate, selectedDate)) {
            selectedDate = newDate;
            renderCalendarHeader();
          }
        }, 50);
      });
    }

    function changeWeek(direction) {
      currentMonday.setDate(currentMonday.getDate() + (direction * 7));
      selectedDate = new Date(currentMonday);
      renderWeekPages();
    }

    function goToToday() {
      selectedDate = new Date();
      currentMonday = getMonday(selectedDate);
      renderWeekPages();
    }

    init();
  </script>
</body>
</html>
