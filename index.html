<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>218 ВМК МГУ</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="218 ВМК">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    /* Контейнер для плавного скролла за пальцем */
    .snap-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .snap-slider::-webkit-scrollbar {
      display: none;
    }

    .snap-item {
      scroll-snap-align: start;
      flex: 0 0 100%;
      width: 100%;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Шапка -->
  <header class="bg-slate-800/95 border-b border-slate-700/80 p-4 sticky top-0 z-20 backdrop-blur-md shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg text-blue-400">218 Группа</h1>
        <p class="text-xs text-slate-400" id="current-month-year">ВМК МГУ</p>
      </div>
      <button onclick="goToToday()" class="text-xs bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/40 px-3 py-1.5 rounded-xl font-medium active:scale-90 transition-transform">
        Сегодня
      </button>
    </div>
  </header>

  <!-- Календарь на неделю -->
  <div class="bg-slate-800/60 border-b border-slate-800 sticky top-[65px] z-10 backdrop-blur-md">
    <div class="max-w-md mx-auto px-2 py-3">
      <div class="flex items-center justify-between mb-2 px-2 text-xs text-slate-400 font-medium">
        <button onclick="changeWeek(-1)" class="p-1 active:scale-90 transition-transform">← Пред. неделя</button>
        <span id="week-range-label" class="text-slate-300 font-semibold"></span>
        <button onclick="changeWeek(1)" class="p-1 active:scale-90 transition-transform">След. неделя →</button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center" id="week-days-container">
        <!-- Дни недели -->
      </div>
    </div>
  </div>

  <!-- Слайдер расписания (тянется за пальцем) -->
  <main class="max-w-md mx-auto flex-1 w-full overflow-hidden">
    <div id="slider-container" class="snap-slider h-full">
      <!-- Экраны дней генерируются автоматически -->
    </div>
  </main>

  <script>
    let scheduleData = null;
    let currentMonday = getMonday(new Date());
    let selectedDate = new Date();
    let isProgrammaticScroll = false;

    const dayNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function isSameDate(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    async function init() {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
      try {
        const response = await fetch('schedule.json');
        scheduleData = await response.json();
        renderWeekPages();
        setupScrollListener();
      } catch (err) {
        document.getElementById('slider-container').innerHTML = 
          '<div class="w-full p-4 text-center text-red-400">Ошибка загрузки расписания</div>';
      }
    }

    function renderWeekPages() {
      const slider = document.getElementById('slider-container');
      slider.innerHTML = '';

      renderCalendarHeader();

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);

        const page = document.createElement('div');
        page.className = 'snap-item p-4 box-border';
        page.dataset.date = date.toISOString();
        page.innerHTML = getDayScheduleHTML(date);

        slider.appendChild(page);
      }

      scrollToSelectedDate(false);
    }

    function renderCalendarHeader() {
      const container = document.getElementById('week-days-container');
      container.innerHTML = '';

      const sunday = new Date(currentMonday);
      sunday.setDate(sunday.getDate() + 6);

      document.getElementById('week-range-label').innerText = 
        `${currentMonday.getDate()} ${monthNames[currentMonday.getMonth()].slice(0, 3)} — ${sunday.getDate()} ${monthNames[sunday.getMonth()].slice(0, 3)}`;

      document.getElementById('current-month-year').innerText = 
        `${monthNames[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);

        const isSelected = isSameDate(date, selectedDate);
        const isToday = isSameDate(date, new Date());

        const dayBtn = document.createElement('button');
        dayBtn.className = `flex flex-col items-center py-2 px-1 rounded-xl transition-all duration-200 active:scale-90 ${
          isSelected 
            ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30' 
            : isToday 
              ? 'bg-slate-700/70 text-blue-400 font-semibold border border-blue-500/30' 
              : 'text-slate-400 hover:bg-slate-800'
        }`;

        const shortDays = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
        dayBtn.innerHTML = `
          <span class="text-[10px] uppercase mb-0.5 opacity-80">${shortDays[date.getDay()]}</span>
          <span class="text-sm">${date.getDate()}</span>
        `;

        dayBtn.onclick = () => {
          selectedDate = new Date(date);
          renderCalendarHeader();
          scrollToSelectedDate(true);
        };

        container.appendChild(dayBtn);
      }
    }

    function getDayScheduleHTML(date) {
      const dayIndex = date.getDay(); 
      const dayName = dayNames[dayIndex];

      if (dayIndex === 0) {
        return `
          <div class="text-center py-16 text-slate-500">
            <div class="text-5xl mb-3">☕</div>
            <p class="font-medium text-slate-300 text-base">Воскресенье — выходной!</p>
            <p class="text-xs text-slate-500 mt-1">Отдыхайте и набирайтесь сил.</p>
          </div>`;
      }

      const dayData = scheduleData.days.find(d => d.day === dayName);

      if (!dayData || !dayData.lessons || dayData.lessons.length === 0) {
        return `
          <div class="text-center py-16 text-slate-500">
            <p class="font-medium text-slate-400">Занятий нет</p>
          </div>`;
      }

      let lessonsHTML = dayData.lessons.map(lesson => {
        const isLecture = lesson.type === 'Лекция';
        const badgeColor = isLecture 
          ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' 
          : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        return `
          <div class="p-4 bg-slate-800/90 border border-slate-700/70 rounded-2xl shadow-md mb-3 active:scale-[0.99] transition-transform">
            <div class="flex justify-between items-start mb-1.5">
              <span class="text-xs font-bold text-blue-400 bg-blue-950/50 px-2.5 py-1 rounded-lg border border-blue-800/40">
                ${lesson.time}
              </span>
              <span class="text-[11px] px-2.5 py-0.5 rounded-md border font-medium ${badgeColor}">
                ${lesson.type}
              </span>
            </div>
            <div class="font-semibold text-slate-100 text-base my-2">${lesson.subject}</div>
            <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-700/50">
              <span class="flex items-center gap-1">📍 Ауд. <b>${lesson.room}</b></span>
              <span class="truncate max-w-[160px]">👤 ${lesson.teacher}</span>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="mb-3 px-1 flex justify-between items-baseline">
          <h2 class="font-bold text-slate-200 text-lg">${dayName}</h2>
          <span class="text-xs text-slate-400 font-medium">${date.getDate()} ${monthNames[date.getMonth()]}</span>
        </div>
        ${lessonsHTML}
      `;
    }

    function scrollToSelectedDate(smooth = true) {
      const slider = document.getElementById('slider-container');
      const dayIndex = (selectedDate.getDay() + 6) % 7; 
      const targetX = slider.clientWidth * dayIndex;

      isProgrammaticScroll = true;
      slider.scrollTo({
        left: targetX,
        behavior: smooth ? 'smooth' : 'auto'
      });

      setTimeout(() => { isProgrammaticScroll = false; }, 350);
    }

    function setupScrollListener() {
      const slider = document.getElementById('slider-container');
      let timeout = null;

      slider.addEventListener('scroll', () => {
        if (isProgrammaticScroll) return;

        clearTimeout(timeout);
        timeout = setTimeout(() => {
          const index = Math.round(slider.scrollLeft / slider.clientWidth);
          const newDate = new Date(currentMonday);
          newDate.setDate(newDate.getDate() + index);

          if (!isSameDate(newDate, selectedDate)) {
            selectedDate = newDate;
            renderCalendarHeader();
          }
        }, 50);
      });
    }

    function changeWeek(direction) {
      currentMonday.setDate(currentMonday.getDate() + (direction * 7));
      selectedDate = new Date(currentMonday);
      renderWeekPages();
    }

    function goToToday() {
      selectedDate = new Date();
      currentMonday = getMonday(selectedDate);
      renderWeekPages();
    }

    init();
  </script>
</body>
</html>
