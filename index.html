<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>218 ВМК МГУ</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8f5ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="218 ВМК">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            lavender: {
              50: '#f8f5ff',
              100: '#f0ebff',
              200: '#e1d4fe',
              300: '#cbb3fc',
              400: '#af88fa',
              500: '#935bf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#1e1b2e',
              900: '#13111f',
              950: '#0b0a12',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .snap-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .snap-slider::-webkit-scrollbar {
      display: none;
    }

    /* На смартфонах — 1 карточка во весь экран со снайпингом, на планшетах/ПК — сетка */
    @media (max-width: 767px) {
      .snap-item {
        scroll-snap-align: start;
        flex: 0 0 100%;
        width: 100%;
      }
    }
  </style>
</head>
<body class="bg-lavender-50 dark:bg-lavender-950 text-slate-800 dark:text-lavender-100 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">

  <!-- Шапка -->
  <header class="bg-white/80 dark:bg-lavender-900/80 border-b border-lavender-200/60 dark:border-lavender-800/60 p-4 sticky top-0 z-20 backdrop-blur-xl transition-colors">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-2 sm:px-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-xl text-lavender-700 dark:text-lavender-300 tracking-tight">218 Группа</h1>
          <span id="week-parity-badge" class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-lavender-100 dark:bg-lavender-800 text-lavender-700 dark:text-lavender-300 border border-lavender-200 dark:border-lavender-700">
            --
          </span>
        </div>
        <p class="text-xs text-slate-500 dark:text-lavender-400 mt-0.5" id="current-month-year">ВМК МГУ</p>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="p-2 rounded-full bg-lavender-100 dark:bg-lavender-800 text-lavender-700 dark:text-lavender-200 active:scale-90 transition-transform">
          <span id="theme-icon">🌙</span>
        </button>
        <button onclick="goToToday()" class="text-xs bg-lavender-600 hover:bg-lavender-700 text-white font-medium px-3.5 py-2 rounded-full shadow-sm active:scale-90 transition-transform">
          Сегодня
        </button>
      </div>
    </div>
  </header>

  <!-- Календарь на неделю -->
  <div class="bg-white/60 dark:bg-lavender-900/40 border-b border-lavender-200/50 dark:border-lavender-800/50 sticky top-[73px] z-10 backdrop-blur-md transition-colors">
    <div class="max-w-7xl mx-auto px-3 py-2.5">
      <div class="flex items-center justify-between mb-2 px-1 text-xs text-slate-500 dark:text-lavender-400 font-medium max-w-md md:max-w-none mx-auto">
        <button onclick="changeWeek(-1)" class="p-1 active:scale-90 transition-transform">← Пред. неделя</button>
        <span id="week-range-label" class="text-slate-700 dark:text-lavender-200 font-semibold"></span>
        <button onclick="changeWeek(1)" class="p-1 active:scale-90 transition-transform">След. неделя →</button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center max-w-3xl mx-auto" id="week-days-container">
        <!-- Дни недели -->
      </div>
    </div>
  </div>

  <!-- Главный блок: Слайдер для мобилок + Автоматическая сетка на ПК -->
  <main class="max-w-7xl mx-auto flex-1 w-full overflow-hidden p-2 md:p-6">
    <div id="slider-container" class="snap-slider md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-6 md:overflow-visible">
      <!-- Страницы дней -->
    </div>
  </main>

  <script>
    let scheduleData = null;
    let currentMonday = getMonday(new Date());
    let selectedDate = new Date();
    let isProgrammaticScroll = false;

    const dayNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function isSameDate(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function getWeekParity(date) {
      const academicStart = new Date(2026, 8, 1);
      const startMonday = getMonday(academicStart);
      const targetMonday = getMonday(date);
      
      const diffTime = targetMonday - startMonday;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const weekNum = Math.floor(diffDays / 7) + 1;
      
      const isOdd = Math.abs(weekNum) % 2 !== 0;
      return {
        weekNum: weekNum,
        isOdd: isOdd,
        key: isOdd ? 'odd' : 'even',
        label: isOdd ? 'нечётная' : 'чётная'
      };
    }

    async function init() {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
      
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '🌙';
      }

      try {
        const response = await fetch('schedule.json');
        scheduleData = await response.json();
        renderWeekPages();
        setupScrollListener();
      } catch (err) {
        document.getElementById('slider-container').innerHTML = 
          '<div class="w-full col-span-full p-4 text-center text-red-500">Ошибка загрузки расписания</div>';
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
        document.getElementById('theme-icon').innerText = '🌙';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
        document.getElementById('theme-icon').innerText = '☀️';
      }
    }

    function renderWeekPages() {
      const slider = document.getElementById('slider-container');
      slider.innerHTML = '';

      renderCalendarHeader();

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);

        const page = document.createElement('div');
        // На мобилках - snap-item, на ПК - адаптивная плашка
        page.className = 'snap-item p-3 md:p-5 box-border bg-white/40 dark:bg-lavender-900/20 md:border md:border-lavender-200/50 md:dark:border-lavender-800/50 md:rounded-3xl md:shadow-sm';
        page.innerHTML = getDayScheduleHTML(date);

        slider.appendChild(page);
      }

      if (window.innerWidth < 768) {
        scrollToSelectedDate(false);
      }
    }

    function renderCalendarHeader() {
      const container = document.getElementById('week-days-container');
      container.innerHTML = '';

      const sunday = new Date(currentMonday);
      sunday.setDate(sunday.getDate() + 6);

      const parity = getWeekParity(selectedDate);
      document.getElementById('week-parity-badge').innerText = `${parity.label}`;

      document.getElementById('week-range-label').innerText = 
        `${currentMonday.getDate()} ${monthNames[currentMonday.getMonth()].slice(0, 3)} — ${sunday.getDate()} ${monthNames[sunday.getMonth()].slice(0, 3)}`;

      document.getElementById('current-month-year').innerText = 
        `${monthNames[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentMonday);
        date.setDate(date.getDate() + i);

        const isSelected = isSameDate(date, selectedDate);
        const isToday = isSameDate(date, new Date());

        const dayBtn = document.createElement('button');
        dayBtn.className = `flex flex-col items-center py-2 px-1 rounded-2xl transition-all duration-200 active:scale-90 ${
          isSelected 
            ? 'bg-lavender-600 text-white font-bold shadow-lg shadow-lavender-600/30' 
            : isToday 
              ? 'bg-lavender-200/70 dark:bg-lavender-800/80 text-lavender-700 dark:text-lavender-300 font-semibold border border-lavender-300 dark:border-lavender-700' 
              : 'text-slate-500 dark:text-lavender-400 hover:bg-lavender-100/50 dark:hover:bg-lavender-800/50'
        }`;

        const shortDays = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
        dayBtn.innerHTML = `
          <span class="text-[10px] uppercase mb-0.5 opacity-70">${shortDays[date.getDay()]}</span>
          <span class="text-sm">${date.getDate()}</span>
        `;

        dayBtn.onclick = () => {
          selectedDate = new Date(date);
          renderCalendarHeader();
          if (window.innerWidth < 768) {
            scrollToSelectedDate(true);
          }
        };

        container.appendChild(dayBtn);
      }
    }

    function renderSingleLessonCard(lesson, isActive = true) {
      const isLecture = lesson.type === 'Лекция';
      const badgeColor = isActive 
        ? (isLecture 
            ? 'bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 border-purple-200 dark:border-purple-800' 
            : 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800')
        : 'bg-slate-100 dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700';

      const parityTag = lesson.parity 
        ? (lesson.parity === 'odd' ? 'Нечётная' : 'Чётная') 
        : null;

      return `
        <div class="p-3.5 transition-all ${isActive ? '' : 'opacity-40 grayscale-[40%]'}" ${!isActive ? 'style="filter: grayscale(0.5);"' : ''}>
          <div class="flex justify-between items-center mb-1 gap-1">
            <div class="flex items-center gap-1.5">
              ${parityTag ? `
                <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${isActive ? 'bg-lavender-600 text-white' : 'bg-slate-300 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">
                  ${parityTag}
                </span>
              ` : ''}
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${badgeColor}">
                ${lesson.type}
              </span>
            </div>
            <span class="text-xs font-semibold ${isActive ? 'text-lavender-700 dark:text-lavender-300 bg-lavender-50 dark:bg-lavender-800/60' : 'text-slate-500 bg-slate-100 dark:bg-slate-800'} px-2 py-0.5 rounded-md">
              📍 ${lesson.room}
            </span>
          </div>
          <div class="font-semibold text-slate-800 dark:text-lavender-50 text-sm my-1 leading-snug">${lesson.subject}</div>
          <div class="text-xs text-slate-500 dark:text-lavender-400 pt-1 truncate">
            👤 ${lesson.teacher}
          </div>
        </div>
      `;
    }

    function getDayScheduleHTML(date) {
      const dayIndex = date.getDay(); 
      const dayName = dayNames[dayIndex];

      if (dayIndex === 0) {
        return `
          <div class="text-center py-16 text-slate-400 dark:text-lavender-500">
            <div class="text-5xl mb-3">☕</div>
            <p class="font-semibold text-slate-700 dark:text-lavender-200 text-lg">Воскресенье</p>
            <p class="text-xs text-slate-400 dark:text-lavender-400 mt-1">Отдыхайте перед учебной неделей</p>
          </div>`;
      }

      const dayData = scheduleData.days.find(d => d.day === dayName);
      const parity = getWeekParity(date);

      if (!dayData || !dayData.lessons || dayData.lessons.length === 0) {
        return `
          <div class="text-center py-16 text-slate-400 dark:text-lavender-500">
            <p class="font-medium">Занятий нет</p>
          </div>`;
      }

      let lessonsHTML = dayData.lessons.map(item => {
        const times = item.time.split(' - ');
        const startTime = times[0] || item.time;
        const endTime = times[1] || '';

        let cardBodyHTML = '';

        if (item.parity_split) {
          const oddLesson = item.parity_split.find(p => p.parity === 'odd') || item.parity_split[0];
          const evenLesson = item.parity_split.find(p => p.parity === 'even') || item.parity_split[1];

          cardBodyHTML = `
            <div class="flex flex-col border border-lavender-200/70 dark:border-lavender-800/80 rounded-2xl bg-white dark:bg-lavender-900/90 shadow-sm overflow-hidden flex-1 divide-y divide-lavender-100 dark:divide-lavender-800/60">
              ${renderSingleLessonCard(oddLesson, parity.key === 'odd')}
              ${renderSingleLessonCard(evenLesson, parity.key === 'even')}
            </div>
          `;
        } else {
          cardBodyHTML = `
            <div class="flex-1 bg-white dark:bg-lavender-900/90 border border-lavender-200/70 dark:border-lavender-800/80 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
              ${renderSingleLessonCard(item, true)}
            </div>
          `;
        }

        return `
          <div class="flex gap-3 mb-3.5 items-stretch">
            <div class="w-16 flex-shrink-0 flex flex-col justify-center items-center text-center bg-white/50 dark:bg-lavender-900/30 rounded-2xl border border-lavender-100 dark:border-lavender-800/40 p-2">
              <span class="text-xs font-bold text-slate-800 dark:text-lavender-100">${startTime}</span>
              ${endTime ? `<span class="text-[10px] text-slate-400 dark:text-lavender-400 mt-0.5">${endTime}</span>` : ''}
            </div>

            ${cardBodyHTML}
          </div>
        `;
      }).join('');

      return `
        <div class="mb-4 px-1 flex justify-between items-baseline">
          <h2 class="font-bold text-slate-800 dark:text-lavender-100 text-xl tracking-tight">${dayName}</h2>
          <span class="text-xs text-slate-400 dark:text-lavender-400 font-medium">${date.getDate()} ${monthNames[date.getMonth()]}</span>
        </div>
        ${lessonsHTML}
      `;
    }

    function scrollToSelectedDate(smooth = true) {
      const slider = document.getElementById('slider-container');
      const dayIndex = (selectedDate.getDay() + 6) % 7; 
      const targetX = slider.clientWidth * dayIndex;

      isProgrammaticScroll = true;
      slider.scrollTo({
        left: targetX,
        behavior: smooth ? 'smooth' : 'auto'
      });

      setTimeout(() => { isProgrammaticScroll = false; }, 350);
    }

    function setupScrollListener() {
      const slider = document.getElementById('slider-container');
      let timeout = null;

      slider.addEventListener('scroll', () => {
        if (isProgrammaticScroll || window.innerWidth >= 768) return;

        clearTimeout(timeout);
        timeout = setTimeout(() => {
          const index = Math.round(slider.scrollLeft / slider.clientWidth);
          const newDate = new Date(currentMonday);
          newDate.setDate(newDate.getDate() + index);

          if (!isSameDate(newDate, selectedDate)) {
            selectedDate = newDate;
            renderCalendarHeader();
          }
        }, 50);
      });
    }

    function changeWeek(direction) {
      currentMonday.setDate(currentMonday.getDate() + (direction * 7));
      selectedDate = new Date(currentMonday);
      renderWeekPages();
    }

    function goToToday() {
      selectedDate = new Date();
      currentMonday = getMonday(selectedDate);
      renderWeekPages();
    }

    init();
  </script>
</body>
</html>
